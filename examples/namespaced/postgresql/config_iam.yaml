---
apiVersion: postgresql.sql.m.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: aurora-iam
  namespace: default
spec:
  # defaultDatabase: postgres
  credentials:
    source: AWSIAMAuth
    connectionSecretRef:
      name: aurora-conn # endpoint, port, username - no password
    # region: us-east-1 # optional; otherwise a "region" secret key, then the controller's AWS env
  # Verify the server certificate and hostname using the mounted CA bundle.
  # See docs/aws-iam-auth.md and examples/aws-iam/deployment-runtime-config.yaml.
  sslMode: verify-full
