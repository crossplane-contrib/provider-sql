apiVersion: postgresql.sql.m.crossplane.io/v1alpha1
kind: Role
metadata:
  name: parent-role
  namespace: default
spec:
  forProvider:
    connectionLimit: 10
    privileges:
      login: true
    configurationParameters:
      - name: 'statement_timeout'
        value: '123'
      - name: 'search_path'
        value: '"$user",public'
  writeConnectionSecretToRef:
    name: example-parent-role-secret
  providerConfigRef:
    kind: ProviderConfig
    name: default
---
apiVersion: postgresql.sql.m.crossplane.io/v1alpha1
kind: Role
metadata:
  name: example-role
  namespace: default
spec:
  forProvider:
    privileges:
      createDb: true
  writeConnectionSecretToRef:
    name: example-role-secret
  providerConfigRef:
    kind: ProviderConfig
    name: default
---
apiVersion: postgresql.sql.m.crossplane.io/v1alpha1
kind: Role
metadata:
  name: ownerrole
  namespace: default
  labels:
    role: owner
spec:
  writeConnectionSecretToRef:
    name: ownerrole-secret
  forProvider:
    privileges:
      createDb: true
      login: true
      createRole: true
      inherit: true
  providerConfigRef:
    kind: ProviderConfig
    name: default
---
apiVersion: postgresql.sql.m.crossplane.io/v1alpha1
kind: Role
metadata:
  name: no-grants-role
  namespace: default
spec:
  writeConnectionSecretToRef:
    name: no-grants-role-secret
  forProvider:
    privileges:
      login: true
  providerConfigRef:
    kind: ProviderConfig
    name: default
---
# Auto-generated password with on-demand rotation.
# With no passwordSecretRef, the provider generates a random password on create
# and writes it to the connection secret below. To rotate it, set
# passwordRotationTrigger to a timestamp later than the current
# status.atProvider.lastPasswordChange; bump it again to rotate again.
# Note: the trigger is ignored until lastPasswordChange has been set once - see
# docs/postgresql-role-passwords.md.
apiVersion: postgresql.sql.m.crossplane.io/v1alpha1
kind: Role
metadata:
  name: rotating-role
  namespace: default
spec:
  forProvider:
    privileges:
      login: true
    passwordRotationTrigger: "2026-01-01T00:00:00Z"
  writeConnectionSecretToRef:
    name: rotating-role-secret
  providerConfigRef:
    kind: ProviderConfig
    name: default
---
# Bring-your-own password.
# The provider applies the value from the referenced secret key and re-applies it
# whenever that secret changes. passwordRotationTrigger has no effect in this mode.
apiVersion: postgresql.sql.m.crossplane.io/v1alpha1
kind: Role
metadata:
  name: byo-password-role
  namespace: default
spec:
  forProvider:
    privileges:
      login: true
    passwordSecretRef:
      name: my-role-password
      key: password
  writeConnectionSecretToRef:
    name: byo-password-role-secret
  providerConfigRef:
    kind: ProviderConfig
    name: default
