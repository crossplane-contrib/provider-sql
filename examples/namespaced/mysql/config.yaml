---
apiVersion: mysql.sql.m.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: default
  namespace: default
spec:
  credentials:
    source: MySQLConnectionSecret
    connectionSecretRef:
      name: db-conn
  # tls one of "false", preferred (default), skip-verify, true, or custom.
  # Quote false: tls: "false"
  tls: preferred
