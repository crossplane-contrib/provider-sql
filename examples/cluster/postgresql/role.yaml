apiVersion: postgresql.sql.crossplane.io/v1alpha1
kind: Role
metadata:
  name: parent-role
spec:
  forProvider:
    connectionLimit: 10
    privileges:
      login: true
    configurationParameters:
      - name: 'statement_timeout'
        value: '123'
      - name: 'search_path'
        value: '"$user",public'
  writeConnectionSecretToRef:
    name: example-parent-role-secret
    namespace: default
---
apiVersion: postgresql.sql.crossplane.io/v1alpha1
kind: Role
metadata:
  name: example-role
spec:
  forProvider:
    privileges:
      createDb: true
  writeConnectionSecretToRef:
    name: example-role-secret
    namespace: default
---
apiVersion: postgresql.sql.crossplane.io/v1alpha1
kind: Role
metadata:
  name: ownerrole
  labels:
    role: owner
spec:
  deletionPolicy:  Orphan
  writeConnectionSecretToRef:
    name: ownerrole-secret
    namespace: default
  forProvider:
    privileges:
      createDb: true
      login: true
      createRole: true
      inherit: true
---
apiVersion: postgresql.sql.crossplane.io/v1alpha1
kind: Role
metadata:
  name: no-grants-role
spec:
  writeConnectionSecretToRef:
    name: no-grants-role-secret
    namespace: default
  forProvider:
    privileges:
      login: true
---
# The wildcard grants below are authoritative for their role and schema: they
# revoke ALL PRIVILEGES before granting. They therefore need a role of their
# own, or they would strip the grants the other examples make.
apiVersion: postgresql.sql.crossplane.io/v1alpha1
kind: Role
metadata:
  name: all-objects-role
spec:
  writeConnectionSecretToRef:
    name: all-objects-role-secret
    namespace: default
  forProvider:
    privileges:
      login: true
