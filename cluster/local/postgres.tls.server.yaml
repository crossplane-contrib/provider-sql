apiVersion: v1
kind: Service
metadata:
  name: postgresdb-postgresql
  namespace: default
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgresdb-postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresdb-postgresql
  namespace: default
spec:
  serviceName: postgresdb-postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresdb-postgresql
  template:
    metadata:
      labels:
        app: postgresdb-postgresql
    spec:
      containers:
      - name: postgresql
        image: postgres:${POSTGRES_VERSION}
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresdb-creds
              key: password
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
        - name: server-tls
          mountPath: /etc/postgresql/tls
          readOnly: true
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -h
            - 127.0.0.1
            - -U
            - postgres
          initialDelaySeconds: 5
          periodSeconds: 5
        args:
        - postgres
        - -c
        - ssl=on
        - -c
        - ssl_cert_file=/etc/postgresql/tls/server-cert.pem
        - -c
        - ssl_key_file=/etc/postgresql/tls/server-key.pem
      volumes:
      - name: data
        emptyDir: {}
      - name: server-tls
        secret:
          secretName: postgres-server-tls
          defaultMode: 288
      securityContext:
        fsGroup: 999
